name: allurectl 2.24.1 check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ALLURE_ENDPOINT: https://testing.qameta.in
      ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
    steps:
      - name: Download allurectl 2.24.1
        run: |
          curl -fsSL https://github.com/allure-framework/allurectl/releases/download/2.24.1/allurectl_linux_amd64 -o allurectl
          chmod +x allurectl
      - run: ./allurectl --version
      - run: ./allurectl launch list --project-id 14733
