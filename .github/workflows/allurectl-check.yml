name: allurectl 2.24.1 check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ALLURE_ENDPOINT: https://testing.qameta.in
      ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x allurectl_linux_amd64
      - run: ./allurectl_linux_amd64 --version
      - run: ./allurectl_linux_amd64 launch list --project-id 14733
